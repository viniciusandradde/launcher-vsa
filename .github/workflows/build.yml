name: Build APK

# Gera o APK de debug a cada push e permite rodar manualmente.
# O APK fica disponível como "Artifact" na aba Actions para baixar no celular.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Garantir permissão do gradlew
        run: chmod +x ./gradlew

      - name: Build do APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
