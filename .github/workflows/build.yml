name: Build APK

# Gera o APK de debug a cada push, publica como artifact e também num Release
# (tag apk-debug) para download direto pelo celular, sem precisar descompactar.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Garantir permissão do gradlew
        run: chmod +x ./gradlew

      - name: Build do APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar o APK num Release (download direto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-debug --yes --cleanup-tag || true
          gh release create apk-debug \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "APK debug (última build)" \
            --notes "APK de debug gerado automaticamente do commit ${{ github.sha }}. Baixe o app-debug.apk abaixo e instale no celular (permita instalar de fontes desconhecidas)." \
            --target "${{ github.sha }}"
